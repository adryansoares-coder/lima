<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3 - Formato de Cores</title>
</head>

<body>
    <header>
        <h1>Cores, Imagens e links</h1>
    </header>
    <main>
        <section>Formato de cor no CSS</section>
        <h3 style="color: #FF5733;">Titulo com cor em hexadecimal</h3>
        <h3 style="color: rgb(0, 128, 255);">Titulo com cor em RGB</h3>
        <h3 style="color: rgba(0, 128, 0, 0.6);">Titulo com cor em RGBA</h3>
        </section>
        <section></section>
        <p style="color: blue">Texto em uma cor especifica</p>
        </section>

        <section>
            <!-- imagem com elemento da pagina-->
        </section>
        <img src="assets/image.png" alt="Teste" title="Teste" width="300" height="300">

        <Section>
        </Section>
        <div style="border: 1px solid yellow;width: 500px; height: 500px; color: black; text-align: center;
            background-image: url('assets/image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;">
            <h2> Imagem como background</h2>
            <p> Esta seçao tem uma imagem de fundo</p>
        </div>"
        </section>
        <h1>Vídeos em HTML</h1>
        <video src="assets/video.mp4" controls autoplay loop width="560" height="315">
            Seu navegador não suporta o elemento de vídeo.
        </video>
        </section>
        <section>
            <h1>Vídeos Externos</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/OWOjRdmpM6I?si=ck8QT_wnBLRM5hoa"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>|
        </section>
    </main>
</body>

</html>
